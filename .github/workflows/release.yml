name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. npm trusts this
# workflow through OIDC trusted publishing, so no npm token is stored.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm 11.5+ (Node 24) is required for OIDC trusted publishing.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
