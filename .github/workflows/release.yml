name: Release

# Publishes packages/annotator to npm when a version tag (v1.2.3) is pushed.
# npm trusts this workflow through OIDC trusted publishing, so no npm token is
# stored. The trust names this repository and this file name: keep
# .github/workflows/release.yml. Mac app releases will use mac-v* tags.
# Actions are pinned to commits, because this job can publish. To update one,
# replace its commit id and the version in the comment beside it.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/annotator
    steps:
      # Full history, so the next step can compare the tag with main.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main. Publish only from main." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # npm 11.5+ (Node 24) is required for OIDC trusted publishing.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check the tag matches packages/annotator/package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
