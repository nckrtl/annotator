name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: "Package: check, build and test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/annotator
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

  mac:
    name: "Mac app: build and test"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/mac/src-tauri -> ../build/rust

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out DesignKit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nckrtl/design-kit
          ssh-key: ${{ secrets.DESIGN_KIT_DEPLOY_KEY }}
          persist-credentials: false
          path: design-kit

      - name: Build and test native app
        env:
          DESIGN_KIT_PATH: ${{ github.workspace }}/design-kit/DesignKit
        run: |
          bun run build
          scripts/test.sh
          scripts/build-app.sh --debug
          scripts/smoke-core.py
