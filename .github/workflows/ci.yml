name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: "Package: check, build and test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/annotator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

  mac:
    name: "Mac app: build and test"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mac/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out DesignKit
        uses: actions/checkout@v4
        with:
          repository: nckrtl/design-kit
          ssh-key: ${{ secrets.DESIGN_KIT_DEPLOY_KEY }}
          persist-credentials: false
          path: design-kit

      - name: Build and test native app
        env:
          DESIGN_KIT_PATH: ${{ github.workspace }}/design-kit/DesignKit
        run: |
          bun run build
          scripts/test.sh
          scripts/build-app.sh --debug
          scripts/smoke-core.py
