name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: "Package: check, build and test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/annotator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Build
        run: bun run build

      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

  mac:
    name: "Mac app: build and test"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mac/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build the views
        run: bun run build

      - name: Test the views
        run: bun test scripts/

      - name: Test the Swift helper
        run: swift test --package-path native

      # The Tauri build bundles the helper, so cargo test needs it. It is signed ad hoc, with no identity.
      - name: Build the Swift helper
        run: bash scripts/build-native.sh

      - name: Test the Rust core
        working-directory: apps/mac/src-tauri
        run: cargo test
